# Paper Trail CI. Every push to main and every pull request (any base branch, v2 included):
#   contract   tools/contract_check.mjs: the machine-checkable parts of docs/web-contract.md
#   smoke      opens every HTML page in headless Chromium at desktop and phone widths and fails on
#              console errors, page errors, failed requests, or horizontal overflow (the template's
#              test, from Web Development Resources/github-template)
#   deck       sorts a small stack in the real page against tools/fake/fake-backend.js and checks
#              the original file reaches (fake) Drive byte for byte
#   sort       the rebuilt Sort deck (#20, #77): drag and overlays, skip and the Skipped sheet, the
#              undo hold, Keep original confirm, check fields, bulk filing, the card detail
#   shell      the app shell and design system (#83): tabs and stacks, pushed screens, the outbox
#              accessory, Search's bottom field, the Scan menu, Settings, sheets and the dialog, themes
#   auth       the web sign-in against the fake backend: no check on open, the redirect code flow
#              and its return, not allowed, Drive consent skipped, Drive tokens, Reconnect, Sign out
#   outbox     the local-first queue (#17, #1, #18): undo hold, chunked resumable uploads, year folders,
#              verification, retries, offline, Reconnect Drive, Send back, the Outbox screen, Shred hold
#   browse     Piles, Search and Paperless against the fake's seeded library (#18, #22, #23): the
#              safe-to-shred rule and hold, swipes and their twins, search and Also in Drive, the ledger
#   scanner    drives Scan document with a fake camera (a generated video of a tilted page): edges
#              found, the page flattened, Done adds one item that files as one PDF, Cancel adds none
#   capture    the Scan menu's sources, the scan review (split, join, stack mode, duplicates), the page
#              viewer, the reading queue and sender rules, against the fake backend (#83)
#   lab        the no-AI lab build's infrastructure (#92) on ?lab: the badge and tint, the lab_ sign-in
#              nonce, users/{uid}/lab/data and "Paperwork Archive (Lab)", the Lab settings section,
#              and the live app unchanged without ?lab
#   lab reader the lab reader on ?lab (tools/lab_reader_test.mjs): reading with the text layer, OCR and
#              the rules (no classify call with compare off), the rules worker, local split, compare
#              mode's chip and sheet, picks as ground truth and sender rules, Lab Stats
#   functions  the classify function's unit tests, Claude stood in; the lab's no-AI rules engine (#92):
#              its unit tests and the eval against the synthetic corpus, which fails under its floors
#   ios        the iPhone app (ios/): xcodegen, a simulator build and the unit tests. macOS minutes
#              cost 10x, and the Swift app is paused, so it runs only when started by hand (Run workflow).
# Pushing a tag like v1.2 publishes a Release with a zip of the site attached.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Open every page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Smoke test every page
        run: node tools/smoke_test.mjs
      - name: Sort a stack against the fake backend
        run: node tools/deck_test.mjs
      - name: The Sort deck (gestures, skip, undo hold, check fields, bulk, detail)
        if: always()
        run: node tools/sort_test.mjs
      - name: The app shell and design system
        if: always()
        run: node tools/shell_test.mjs
      - name: Sign-in, staying signed in and Drive tokens (#14, #15)
        if: always()
        run: node tools/auth_test.mjs
      - name: Scan a document with a fake camera
        if: always()
        run: node tools/scanner_test.mjs
      - name: The outbox against the fake backend
        if: always()
        run: node tools/outbox_test.mjs
      - name: Capture, the scan review, stack mode and sender rules
        if: always()
        run: node tools/capture_test.mjs
      - name: Piles, Search and Paperless against a seeded library
        if: always()
        run: node tools/browse_test.mjs
      - name: The lab build (#92)
        if: always()
        run: node tools/lab_test.mjs
      - name: The lab reader, compare mode and Lab Stats (#92)
        if: always()
        run: node tools/lab_reader_test.mjs
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-screenshots
          path: tools/smoke/
          retention-days: 14

  functions:
    name: Function unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions
      - run: node --test functions/test/*.test.mjs
      - name: The lab rules engine (#92), unit tests and eval floors
        if: always()
        run: |
          node --test tools/lab/*.test.mjs
          node tools/lab/eval-rules.mjs --assert
      - name: Check the web module contract
        if: always()
        run: node tools/contract_check.mjs

  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did ios/ or this workflow change
        id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then RANGE="origin/$BASE_REF...HEAD"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then RANGE="$BEFORE..HEAD"
          else RANGE="HEAD~1..HEAD"; fi
          if git diff --name-only "$RANGE" | grep -qE '^(ios/|\.github/workflows/ci\.yml$)'; then CHANGED=true; else CHANGED=false; fi
          echo "Range $RANGE, ios changed: $CHANGED"
          echo "ios=$CHANGED" >> "$GITHUB_OUTPUT"

  ios:
    name: iPhone app build and tests
    needs: changes
    # The Swift app is paused (2026-10-15, #83) and macOS minutes are expensive, so this job only runs
    # when started by hand: Actions, CI, Run workflow.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Pick the newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ios/.spm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/project.yml') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Generate the project
        run: xcodegen
      - name: Build and run the unit tests
        run: |
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone"))] | last | .udid')
          echo "Simulator: $DEVICE"
          set -o pipefail
          xcodebuild test \
            -project PaperTrail.xcodeproj -scheme PaperTrail \
            -destination "id=$DEVICE" \
            -clonedSourcePackagesDirPath .spm \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log | grep -E "error:|Test.*(passed|failed)|\*\* (TEST|BUILD)"

  release:
    name: Publish release
    needs: [smoke, functions]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Zip the site
        run: |
          NAME="${GITHUB_REPOSITORY##*/}-${GITHUB_REF_NAME}"
          zip -r "$NAME.zip" public functions firebase firebase.json .firebaserc -x "functions/node_modules/*" "*.DS_Store"
          ls -la "$NAME.zip"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./*.zip --title "$GITHUB_REF_NAME" --generate-notes
